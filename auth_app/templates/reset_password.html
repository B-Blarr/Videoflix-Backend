<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#ffffff; padding-left: 40px;">
    <tr>
      <td style="padding:32px 16px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:600px;">

          <tr>
            <td style="font-family:Arial,Helvetica,sans-serif; font-size:16px;
                       line-height:24px; color:#000000;">
              <p style="margin:0 0 4px 0;">
                Dear <span style="color:#2e3edf;">{{ email }}</span>,
              </p>
              <p style="margin:0;">
                Thank you for registering with
                <span style="color:#2e3edf;">Videoflix</span>.
                To complete your registration and verify your email address,
                please click the link below:
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:32px 0;">
              <a href="{{ link }}"
                 style="display:inline-block; background-color:#2413d8; color:#ffffff;
                        font-family:Arial,Helvetica,sans-serif; font-size:18px;
                        font-weight:bold; line-height:20px; text-decoration:none;
                        padding:18px 36px; border-radius:40px;">
                Activate account
              </a>
            </td>
          </tr>

          <tr>
            <td style="font-family:Arial,Helvetica,sans-serif; font-size:16px;
                       line-height:24px; color:#000000;">
              <p style="margin:0 0 24px 0;">
                If you did not create an account with us, please disregard this email.
              </p>
              <p style="margin:0 0 24px 0;">Best regards,</p>
              <p style="margin:0;">Your Videoflix Team.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 40px 0;">
              <img src="{{ logo_url }}" alt="Videoflix" width="240"
                   style="display:block; width:240px; max-width:100%; height:auto; border:0;">
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
